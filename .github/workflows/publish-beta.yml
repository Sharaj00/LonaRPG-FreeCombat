name: Publish tested Beta
on:
  push:
    branches: [main]
    paths: [release.json, .github/workflows/publish-beta.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-beta-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact public source commit
        shell: pwsh
        run: |
          git init .
          git remote add origin "https://github.com/$env:GITHUB_REPOSITORY.git"
          git fetch --depth=1 origin $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Source fetch failed' }
          git checkout --detach FETCH_HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source checkout failed' }
      - name: Verify tested release archives
        shell: pwsh
        run: |
          $release = Get-Content release.json -Raw | ConvertFrom-Json
          $folder = Join-Path releases $release.tag
          $manifest = Get-Content (Join-Path $folder manifest.json) -Raw | ConvertFrom-Json
          if (@($manifest.PSObject.Properties).Count -ne 4) { throw 'Expected four addon archives' }
          foreach ($entry in $manifest.PSObject.Properties) {
            $file = Join-Path $folder $entry.Name
            $digest = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($digest -ne $entry.Value.sha256) { throw "Checksum mismatch: $($entry.Name)" }
          }
          python -m compileall -q tools
          if ($LASTEXITCODE -ne 0) { throw 'Python syntax check failed' }
      - name: Publish Beta and exact tested assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = Get-Content release.json -Raw | ConvertFrom-Json
          $folder = Join-Path releases $release.tag
          $files = @(Get-ChildItem -LiteralPath $folder -Filter '*.zip' | ForEach-Object FullName)
          $files += (Join-Path $folder SHA256SUMS.txt)
          if ($release.replace_assets -eq $true) {
            gh release upload $release.tag @files --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { throw 'Could not replace the explicitly requested release assets' }
            gh release edit $release.tag --repo $env:GITHUB_REPOSITORY --notes-file RELEASE_NOTES.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not update installation notes' }
          } else {
            gh release create $release.tag @files --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $release.title --notes-file RELEASE_NOTES.md --prerelease --draft
            if ($LASTEXITCODE -ne 0) { throw 'Draft release or asset upload failed; nothing was replaced' }
            gh release edit $release.tag --repo $env:GITHUB_REPOSITORY --draft=false
            if ($LASTEXITCODE -ne 0) { throw 'Could not publish the completed draft' }
          }
          gh release view $release.tag --repo $env:GITHUB_REPOSITORY --json url,tagName,isDraft,isPrerelease,assets
          if ($LASTEXITCODE -ne 0) { throw 'Published release verification failed' }
